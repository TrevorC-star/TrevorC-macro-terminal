<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrevorC Live Macro Terminal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terminalBg: '#0b0e14',
            panelBg: '#131722',
            borderDark: '#2a2e39',
            neonGreen: '#089981',
            neonRed: '#f23645',
            neonAmber: '#ff9800',
            accentBlue: '#2962ff'
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0e14; }
    ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-panelBg border-b border-borderDark px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <i class="fa-solid font-bold text-xl text-accentBlue fa-satellite-dish"></i>
      <h1 class="text-xl font-bold tracking-wider text-white">TREVORC <span class="text-accentBlue">MACRO TERMINAL</span></h1>
      <span class="bg-neonRed/20 text-neonRed text-xs font-semibold px-2.5 py-0.5 rounded border border-neonRed/30 animate-pulse flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-neonRed"></span> LIVE FUNDAMENTAL WIRE
      </span>
    </div>

    <!-- Monitored Assets Indicator -->
    <div class="flex flex-wrap items-center gap-1.5 my-2 sm:my-0">
      <span class="text-xs text-gray-400 font-medium mr-1">Monitored Currencies:</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">USD</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">EUR</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">GBP</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">JPY</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">CAD</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">AUD</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">NZD</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">CHF</span>
    </div>
  </header>

  <!-- Rollover Timer Banner -->
  <section class="bg-gradient-to-r from-panelBg via-red-950/20 to-panelBg border-b border-borderDark px-6 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between text-sm">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-clock text-neonRed"></i>
        <span class="font-bold text-white uppercase tracking-wide">Next 00:00 UTC Session Rollover:</span>
      </div>
      <div class="flex items-center space-x-4">
        <span class="text-xs text-gray-400">Time Remaining:</span>
        <div id="live-countdown" class="bg-neonRed/10 border border-neonRed/40 text-neonRed px-3 py-1 rounded font-mono font-bold text-sm tracking-widest">
          Loading...
        </div>
      </div>
    </div>
  </section>

  <!-- Main Grid Layout -->
  <main class="flex-grow p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT COLUMN: Live TradingView Fundamental News Stream -->
    <section class="lg:col-span-7 flex flex-col space-y-6">
      <div class="bg-panelBg border border-borderDark rounded-lg p-5 flex-grow flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-borderDark">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-bolt text-accentBlue"></i>
            <h2 class="text-lg font-bold text-white">Live Forex & Macro News Stream</h2>
          </div>
          <span class="text-xs text-emerald-400 font-mono"><i class="fa-solid fa-circle text-[8px] animate-pulse mr-1"></i> Live Feed Connected</span>
        </div>

        <!-- TradingView Embedded Timeline Widget (Forex & Central Banks) -->
        <div class="tradingview-widget-container" style="height: 540px; width: 100%;">
          <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
          {
            "feedMode": "market",
            "market": "forex",
            "colorTheme": "dark",
            "isTransparent": true,
            "displayMode": "regular",
            "width": "100%",
            "height": "540",
            "locale": "en"
          }
          </script>
        </div>
      </div>
    </section>

    <!-- RIGHT COLUMN: Red-Folder Economic Calendar -->
    <section class="lg:col-span-5 flex flex-col space-y-6">
      <div class="bg-panelBg border border-borderDark rounded-lg p-5">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-borderDark">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-calendar-day text-neonRed"></i>
            <h2 class="text-lg font-bold text-white">Red-Folder Economic Calendar</h2>
          </div>
          <span class="text-xs text-neonRed font-bold bg-neonRed/10 px-2 py-0.5 rounded border border-neonRed/20">G8 High Impact</span>
        </div>

        <div class="tradingview-widget-container" style="height: 540px; width: 100%;">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
          {
            "width": "100%",
            "height": "540",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "en",
            "importanceFilter": "1",
            "currencyFilter": "USD,EUR,GBP,JPY,CAD,AUD,NZD,CHF"
          }
          </script>
        </div>
      </div>
    </section>

  </main>

  <!-- Script: Persistent UTC Session Countdown -->
  <script>
    function startCountdown() {
      function update() {
        const now = new Date();
        const targetDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0));
        const diff = targetDate.getTime() - now.getTime();

        if (diff <= 0) {
          document.getElementById('live-countdown').innerText = "00h 00m 00s";
          return;
        }

        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('live-countdown').innerText = 
          `${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}s ${seconds.toString().padStart(2, '0')}s`.replace('s ', 'm ');
      }

      update();
      setInterval(update, 1000);
    }

    window.onload = function() {
      startCountdown();
    };
  </script>
</body>
</html>
