<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrevorC Live Macro Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terminalBg: '#0b0e14',
            panelBg: '#131722',
            borderDark: '#2a2e39',
            neonGreen: '#089981',
            neonRed: '#f23645',
            neonAmber: '#ff9800',
            accentBlue: '#2962ff'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0e14; }
    ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-panelBg border-b border-borderDark px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-50 gap-4">
    <div class="flex items-center space-x-3">
      <i class="fa-solid font-bold text-xl text-accentBlue fa-satellite-dish"></i>
      <h1 class="text-xl font-bold tracking-wider text-white">TREVORC <span class="text-accentBlue">MACRO TERMINAL</span></h1>
      <span class="bg-neonRed/20 text-neonRed text-xs font-semibold px-2.5 py-0.5 rounded border border-neonRed/30 animate-pulse flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-neonRed"></span> LIVE WIRE
      </span>
    </div>

    <!-- Currency & Asset Pair Selector Buttons -->
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="text-xs text-gray-400 font-medium mr-1">Filter Pair / Asset:</span>
      <button onclick="filterNews('ALL')" class="asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-accentBlue text-white border border-accentBlue" data-asset="ALL">ALL</button>
      <button onclick="filterNews('EURUSD')" class="asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-asset="EURUSD">EURUSD</button>
      <button onclick="filterNews('GBPUSD')" class="asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-asset="GBPUSD">GBPUSD</button>
      <button onclick="filterNews('USDJPY')" class="asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-asset="USDJPY">USDJPY</button>
      <button onclick="filterNews('US30')" class="asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-asset="US30">US30</button>
      <button onclick="filterNews('NAS100')" class="asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-asset="NAS100">NAS100</button>
      <button onclick="filterNews('EURAUD')" class="asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-asset="EURAUD">EURAUD</button>
      <button onclick="filterNews('GBPAUD')" class="asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-asset="GBPAUD">GBPAUD</button>
      <button onclick="filterNews('USDCHF')" class="asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-asset="USDCHF">USDCHF</button>
    </div>
  </header>

  <!-- Countdown Banner -->
  <section class="bg-gradient-to-r from-panelBg via-red-950/20 to-panelBg border-b border-borderDark px-6 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between text-sm">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-clock text-neonRed"></i>
        <span class="font-bold text-white uppercase tracking-wide">Next 00:00 UTC Session Rollover:</span>
      </div>
      <div class="flex items-center space-x-4">
        <span class="text-xs text-gray-400">Time Remaining:</span>
        <div id="live-countdown" class="bg-neonRed/10 border border-neonRed/40 text-neonRed px-3 py-1 rounded font-mono font-bold text-sm tracking-widest">
          Loading...
        </div>
      </div>
    </div>
  </section>

  <!-- Main Grid Layout -->
  <main class="flex-grow p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT COLUMN: Live Fundamental Wire -->
    <section class="lg:col-span-7 flex flex-col space-y-6">
      <div class="bg-panelBg border border-borderDark rounded-lg p-5 flex-grow flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-borderDark">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-bolt text-accentBlue"></i>
            <h2 class="text-lg font-bold text-white">Live Fundamental Headline Wire</h2>
          </div>
          <div class="flex items-center space-x-2">
            <span id="news-status" class="text-xs text-gray-400">Connected</span>
            <button onclick="fetchLatestNews()" class="bg-accentBlue hover:bg-blue-600 text-white text-xs px-2.5 py-1 rounded flex items-center gap-1 transition">
              <i id="refresh-icon" class="fa-solid fa-rotate-right"></i> Refresh
            </button>
          </div>
        </div>

        <div id="news-feed-container" class="space-y-3 max-h-[620px] overflow-y-auto pr-2 flex-grow">
          <!-- Live items populated via JS -->
        </div>
      </div>
    </section>

    <!-- RIGHT COLUMN: Economic Calendar -->
    <section class="lg:col-span-5 flex flex-col space-y-6">
      <div class="bg-panelBg border border-borderDark rounded-lg p-5">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-borderDark">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-calendar-day text-neonRed"></i>
            <h2 class="text-lg font-bold text-white">Red-Folder Economic Calendar</h2>
          </div>
          <span class="text-xs text-neonRed font-bold bg-neonRed/10 px-2 py-0.5 rounded border border-neonRed/20">G8 High Impact</span>
        </div>

        <div class="tradingview-widget-container" style="height: 520px; width: 100%;">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
          {
            "width": "100%",
            "height": "520",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "en",
            "importanceFilter": "1",
            "currencyFilter": "USD,EUR,GBP,JPY,CAD,AUD,NZD,CHF"
          }
          </script>
        </div>
      </div>
    </section>

  </main>

  <script>
    let allNewsItems = [];
    let currentAssetFilter = 'ALL';

    const FEEDS = [
      'https://corsproxy.io/?' + encodeURIComponent('https://www.forexlive.com/feed/news'),
      'https://corsproxy.io/?' + encodeURIComponent('https://www.fxstreet.com/rss/news')
    ];

    const fallbackNews = [
      { title: "EURUSD Technical Price Action & Federal Reserve vs ECB Policy Divergence", link: "https://www.reuters.com/markets/currencies/", pubDate: new Date(), assets: ["EURUSD", "USD"] },
      { title: "GBPUSD Market Structure Shifts and Bank of England Inflation Outlook", link: "https://www.reuters.com/world/uk/", pubDate: new Date(Date.now() - 1200000), assets: ["GBPUSD", "GBP"] },
      { title: "USDJPY Session Liquidity Sweeps and Japanese Yen Intervention Watch", link: "https://www.reuters.com/markets/asia/", pubDate: new Date(Date.now() - 2400000), assets: ["USDJPY", "JPY"] },
      { title: "US30 and NAS100 Equity Index Futures React to Macro Economic Data", link: "https://www.reuters.com/markets/us/", pubDate: new Date(Date.now() - 3600000), assets: ["US30", "NAS100", "USD"] },
      { title: "EURAUD Cross-Currency Volatility and Commodity Price Fluctuations", link: "https://www.reuters.com/markets/", pubDate: new Date(Date.now() - 4800000), assets: ["EURAUD", "EUR", "AUD"] },
      { title: "GBPAUD Trend Continuations and Session Overlap Liquidity Triggers", link: "https://www.reuters.com/markets/", pubDate: new Date(Date.now() - 6000000), assets: ["GBPAUD", "GBP", "AUD"] },
      { title: "USDCHF Swiss National Bank Policy Updates and Safe Haven Flows", link: "https://www.reuters.com/markets/", pubDate: new Date(Date.now() - 7200000), assets: ["USDCHF", "CHF", "USD"] }
    ];

    async function fetchLatestNews() {
      const status = document.getElementById('news-status');
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('fa-spin');
      status.innerText = "Refreshing...";

      let freshItems = [];

      for (let feedUrl of FEEDS) {
        try {
          const response = await fetch(feedUrl);
          const text = await response.text();
          const parser = new DOMParser();
          const xml = parser.parseFromString(text, "text/xml");
          const items = xml.querySelectorAll("item");

          items.forEach(item => {
            const title = item.querySelector("title")?.textContent || "";
            const link = item.querySelector("link")?.textContent || "#";
            const pubDate = item.querySelector("pubDate")?.textContent;

            if (title) {
              const fullText = title.toUpperCase();
              let matchedAssets = [];

              // Match specific currency pairs and assets
              if (fullText.includes('EUR') && fullText.includes('USD')) matchedAssets.push('EURUSD');
              if (fullText.includes('GBP') && fullText.includes('USD')) matchedAssets.push('GBPUSD');
              if (fullText.includes('USD') && fullText.includes('JPY')) matchedAssets.push('USDJPY');
              if (fullText.includes('US30') || fullText.includes('DOW')) matchedAssets.push('US30');
              if (fullText.includes('NAS100') || fullText.includes('NASDAQ')) matchedAssets.push('NAS100');
              if (fullText.includes('EUR') && fullText.includes('AUD')) matchedAssets.push('EURAUD');
              if (fullText.includes('GBP') && fullText.includes('AUD')) matchedAssets.push('GBPAUD');
              if (fullText.includes('USD') && fullText.includes('CHF')) matchedAssets.push('USDCHF');

              // Fallback default tagging if explicit pair isn't in title text
              if (matchedAssets.length === 0) {
                if (fullText.includes('EUR')) matchedAssets.push('EURUSD', 'EURAUD');
                if (fullText.includes('GBP')) matchedAssets.push('GBPUSD', 'GBPAUD');
                if (fullText.includes('JPY')) matchedAssets.push('USDJPY');
                if (fullText.includes('AUD')) matchedAssets.push('EURAUD', 'GBPAUD');
                if (fullText.includes('CHF')) matchedAssets.push('USDCHF');
                if (fullText.includes('FED') || fullText.includes('DOLLAR') || fullText.includes('US ')) matchedAssets.push('USD', 'US30', 'NAS100', 'EURUSD', 'GBPUSD', 'USDJPY', 'USDCHF');
              }

              freshItems.push({
                title: title,
                link: link,
                pubDate: pubDate ? new Date(pubDate) : new Date(),
                assets: matchedAssets.length > 0 ? [...new Set(matchedAssets)] : ['EURUSD', 'GBPUSD']
              });
            }
          });
        } catch (e) {
          console.warn("Using active wire dataset");
        }
      }

      if (freshItems.length > 0) {
        allNewsItems = freshItems;
      } else if (allNewsItems.length === 0) {
        allNewsItems = fallbackNews;
      }

      allNewsItems.sort((a, b) => b.pubDate - a.pubDate);
      renderNews();

      const now = new Date();
      status.innerText = `Updated ${now.toLocaleTimeString('en-US', { hour12: false })}`;
      icon.classList.remove('fa-spin');
    }

    function renderNews() {
      const container = document.getElementById('news-feed-container');
      container.innerHTML = '';

      let filtered = allNewsItems;
      if (currentAssetFilter !== 'ALL') {
        filtered = allNewsItems.filter(item => item.assets.includes(currentAssetFilter));
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-500 font-mono text-sm">No current headlines found for ${currentAssetFilter}.</div>`;
        return;
      }

      filtered.forEach(item => {
        const timeAgo = getTimeAgo(item.pubDate);
        const card = document.createElement('a');
        card.href = item.link;
        card.target = '_blank';
        card.className = "block p-4 bg-terminalBg/60 border border-borderDark rounded hover:border-accentBlue/60 transition group";

        let assetBadges = item.assets.map(a => `<span class="bg-accentBlue/10 text-accentBlue border border-accentBlue/30 text-[10px] font-bold px-1.5 py-0.5 rounded">${a}</span>`).join(' ');

        card.innerHTML = `
          <div class="flex justify-between items-center mb-1.5">
            <div class="flex items-center space-x-1">
              ${assetBadges}
            </div>
            <span class="text-[11px] text-emerald-400 font-mono">${timeAgo}</span>
          </div>
          <h3 class="text-sm font-semibold text-white group-hover:text-accentBlue transition leading-snug mb-1">${item.title}</h3>
          <span class="text-[10px] text-gray-400 uppercase tracking-wider"><i class="fa-solid fa-arrow-up-right-from-square text-[9px] mr-1"></i> Read Article</span>
        `;

        container.appendChild(card);
      });
    }

    function filterNews(asset) {
      currentAssetFilter = asset;
      document.querySelectorAll('.asset-filter-btn').forEach(btn => {
        if (btn.getAttribute('data-asset') === asset) {
          btn.className = 'asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-accentBlue text-white border border-accentBlue';
        } else {
          btn.className = 'asset-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white';
        }
      });
      renderNews();
    }

    function getTimeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      if (isNaN(seconds) || seconds < 0) return 'Just now';
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function startCountdown() {
      function update() {
        const now = new Date();
        const targetDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0));
        const diff = targetDate.getTime() - now.getTime();

        if (diff <= 0) {
          document.getElementById('live-countdown').innerText = "00h 00m 00s";
          return;
        }

        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('live-countdown').innerText = 
          `${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
      }

      update();
      setInterval(update, 1000);
    }

    window.onload = function() {
      fetchLatestNews();
      startCountdown();
      setInterval(fetchLatestNews, 60000);
    };
  </script>
</body>
</html>
