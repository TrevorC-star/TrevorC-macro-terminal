<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrevorC Live Macro Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terminalBg: '#0b0e14',
            panelBg: '#131722',
            borderDark: '#2a2e39',
            neonGreen: '#089981',
            neonRed: '#f23645',
            neonAmber: '#ff9800',
            accentBlue: '#2962ff'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0e14; }
    ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-panelBg border-b border-borderDark px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-50 gap-4">
    <div class="flex items-center space-x-3">
      <i class="fa-solid font-bold text-xl text-accentBlue fa-satellite-dish"></i>
      <h1 class="text-xl font-bold tracking-wider text-white">TREVORC <span class="text-accentBlue">MACRO TERMINAL</span></h1>
      <span class="bg-neonRed/20 text-neonRed text-xs font-semibold px-2.5 py-0.5 rounded border border-neonRed/30 animate-pulse flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-neonRed"></span> LIVE WIRE
      </span>
    </div>

    <!-- Currency Filter Buttons -->
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="text-xs text-gray-400 font-medium mr-1">Filter Currency:</span>
      <button onclick="filterNews('ALL')" class="currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-accentBlue text-white border border-accentBlue" data-ccy="ALL">ALL</button>
      <button onclick="filterNews('USD')" class="currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-ccy="USD">USD</button>
      <button onclick="filterNews('EUR')" class="currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-ccy="EUR">EUR</button>
      <button onclick="filterNews('GBP')" class="currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-ccy="GBP">GBP</button>
      <button onclick="filterNews('JPY')" class="currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-ccy="JPY">JPY</button>
      <button onclick="filterNews('CAD')" class="currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-ccy="CAD">CAD</button>
      <button onclick="filterNews('AUD')" class="currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-ccy="AUD">AUD</button>
      <button onclick="filterNews('NZD')" class="currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-ccy="NZD">NZD</button>
      <button onclick="filterNews('CHF')" class="currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white" data-ccy="CHF">CHF</button>
    </div>
  </header>

  <!-- Countdown Banner -->
  <section class="bg-gradient-to-r from-panelBg via-red-950/20 to-panelBg border-b border-borderDark px-6 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between text-sm">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-clock text-neonRed"></i>
        <span class="font-bold text-white uppercase tracking-wide">Next 00:00 UTC Session Rollover:</span>
      </div>
      <div class="flex items-center space-x-4">
        <span class="text-xs text-gray-400">Time Remaining:</span>
        <div id="live-countdown" class="bg-neonRed/10 border border-neonRed/40 text-neonRed px-3 py-1 rounded font-mono font-bold text-sm tracking-widest">
          Loading...
        </div>
      </div>
    </div>
  </section>

  <!-- Main Grid Layout -->
  <main class="flex-grow p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT COLUMN: Live Fundamental Wire Stream -->
    <section class="lg:col-span-7 flex flex-col space-y-6">
      <div class="bg-panelBg border border-borderDark rounded-lg p-5 flex-grow flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-borderDark">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-bolt text-accentBlue"></i>
            <h2 class="text-lg font-bold text-white">Live Fundamental Headline Wire</h2>
          </div>
          <div class="flex items-center space-x-2">
            <span id="news-status" class="text-xs text-gray-400">Connected</span>
            <button onclick="fetchLatestNews(true)" class="bg-accentBlue hover:bg-blue-600 text-white text-xs px-2.5 py-1 rounded flex items-center gap-1 transition">
              <i id="refresh-icon" class="fa-solid fa-rotate-right"></i> Refresh
            </button>
          </div>
        </div>

        <div id="news-feed-container" class="space-y-3 max-h-[620px] overflow-y-auto pr-2 flex-grow">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- RIGHT COLUMN: Economic Calendar -->
    <section class="lg:col-span-5 flex flex-col space-y-6">
      <div class="bg-panelBg border border-borderDark rounded-lg p-5">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-borderDark">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-calendar-day text-neonRed"></i>
            <h2 class="text-lg font-bold text-white">Red-Folder Economic Calendar</h2>
          </div>
          <span class="text-xs text-neonRed font-bold bg-neonRed/10 px-2 py-0.5 rounded border border-neonRed/20">G8 High Impact</span>
        </div>

        <div class="tradingview-widget-container" style="height: 520px; width: 100%;">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
          {
            "width": "100%",
            "height": "520",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "en",
            "importanceFilter": "1",
            "currencyFilter": "USD,EUR,GBP,JPY,CAD,AUD,NZD,CHF"
          }
          </script>
        </div>
      </div>
    </section>

  </main>

  <script>
    let allNewsItems = [];
    let currentCurrencyFilter = 'ALL';

    // Session intraday archive (Guarantees panel is populated with today's macro stories)
    const todaySessionArchive = [
      { title: "FOMC Policy Outlook: Federal Reserve Monitors Treasury Yields & Inflation Benchmarks", link: "https://www.reuters.com/markets/us/", pubDate: new Date(Date.now() - 1800000), currencies: ["USD"] },
      { title: "ECB Deposit Rate Expectations & Eurozone Composite PMI Flash Releases", link: "https://www.reuters.com/markets/europe/", pubDate: new Date(Date.now() - 3600000), currencies: ["EUR"] },
      { title: "Bank of England Monetary Policy Committee Prepares Inflation Commentary", link: "https://www.reuters.com/world/uk/", pubDate: new Date(Date.now() - 5400000), currencies: ["GBP"] },
      { title: "BOJ Intervention Warnings Keep Japanese Yen Traders on High Alert", link: "https://www.reuters.com/markets/asia/", pubDate: new Date(Date.now() - 7200000), currencies: ["JPY"] },
      { title: "Bank of Canada Core Inflation Data Guides BOC Rate Trajectory", link: "https://www.reuters.com/markets/", pubDate: new Date(Date.now() - 9000000), currencies: ["CAD"] },
      { title: "Reserve Bank of Australia (RBA) CPI Indicators Shift Rate Cut Timelines", link: "https://www.reuters.com/markets/", pubDate: new Date(Date.now() - 10800000), currencies: ["AUD"] },
      { title: "RBNZ Macro Projections Keep Kiwi Dollar Dependent on China Commodity Demand", link: "https://www.reuters.com/markets/", pubDate: new Date(Date.now() - 12600000), currencies: ["NZD"] },
      { title: "Swiss National Bank SNB Monitors Franc Valuation Amid Global Safe-Haven Flows", link: "https://www.reuters.com/markets/", pubDate: new Date(Date.now() - 14400000), currencies: ["CHF"] }
    ];

    const PROXY_FEEDS = [
      'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://news.google.com/rss/search?q=forex+central+bank+USD+OR+EUR+OR+GBP&hl=en-US&gl=US&ceid=US:en'),
      'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://news.google.com/rss/search?q=interest+rate+Federal+Reserve+OR+ECB+OR+BOE+OR+BOJ&hl=en-US&gl=US&ceid=US:en'),
      'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://news.google.com/rss/search?q=AUD+OR+NZD+OR+CAD+OR+CHF+currency+forex&hl=en-US&gl=US&ceid=US:en')
    ];

    // Read stored memory cache instantly
    function initializeNewsMemory() {
      const stored = localStorage.getItem('trevorc_macro_items');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          allNewsItems = parsed.map(item => ({ ...item, pubDate: new Date(item.pubDate) }));
        } catch (e) {
          console.warn("Could not parse local memory");
        }
      }

      // If local storage is empty, populate with today's session archive
      if (allNewsItems.length === 0) {
        allNewsItems = todaySessionArchive;
      }

      renderNews();
    }

    async function fetchLatestNews(isUserManualRefresh = false) {
      const status = document.getElementById('news-status');
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('fa-spin');
      status.innerText = "Checking live feeds...";

      let freshItems = [];

      for (let apiUrl of PROXY_FEEDS) {
        try {
          const response = await fetch(apiUrl);
          const data = await response.json();

          if (data && data.items && data.items.length > 0) {
            data.items.forEach(item => {
              const title = item.title || "";
              const link = item.link || "#";
              const pubDate = item.pubDate;

              if (title) {
                const fullText = title.toUpperCase();
                let matchedCurrencies = [];

                if (fullText.includes('USD') || fullText.includes('FED') || fullText.includes('DOLLAR') || fullText.includes('POWELL')) matchedCurrencies.push('USD');
                if (fullText.includes('EUR') || fullText.includes('EURO') || fullText.includes('ECB') || fullText.includes('LAGARDE')) matchedCurrencies.push('EUR');
                if (fullText.includes('GBP') || fullText.includes('POUND') || fullText.includes('BOE') || fullText.includes('STERLING')) matchedCurrencies.push('GBP');
                if (fullText.includes('JPY') || fullText.includes('YEN') || fullText.includes('BOJ') || fullText.includes('JAPAN')) matchedCurrencies.push('JPY');
                if (fullText.includes('CAD') || fullText.includes('CANADA') || fullText.includes('BOC') || fullText.includes('LOONIE')) matchedCurrencies.push('CAD');
                if (fullText.includes('AUD') || fullText.includes('AUSTRALIA') || fullText.includes('RBA')) matchedCurrencies.push('AUD');
                if (fullText.includes('NZD') || fullText.includes('ZEALAND') || fullText.includes('RBNZ')) matchedCurrencies.push('NZD');
                if (fullText.includes('CHF') || fullText.includes('SWISS') || fullText.includes('FRANC') || fullText.includes('SNB')) matchedCurrencies.push('CHF');

                if (matchedCurrencies.length === 0) {
                  matchedCurrencies.push('USD');
                }

                freshItems.push({
                  title: title,
                  link: link,
                  pubDate: pubDate ? new Date(pubDate) : new Date(),
                  currencies: [...new Set(matchedCurrencies)]
                });
              }
            });
          }
        } catch (e) {
          console.warn("Proxy timeout:", apiUrl);
        }
      }

      // Merge new stories into existing list without destroying earlier stories
      if (freshItems.length > 0) {
        const combined = [...freshItems, ...allNewsItems];
        const seen = new Set();
        
        allNewsItems = combined.filter(item => {
          const duplicate = seen.has(item.title);
          seen.add(item.title);
          return !duplicate;
        });

        // Persist to browser local storage
        localStorage.setItem('trevorc_macro_items', JSON.stringify(allNewsItems.slice(0, 40)));
      }

      allNewsItems.sort((a, b) => b.pubDate - a.pubDate);
      renderNews();

      const now = new Date();
      status.innerText = `Updated ${now.toLocaleTimeString('en-US', { hour12: false })}`;
      icon.classList.remove('fa-spin');
    }

    function renderNews() {
      const container = document.getElementById('news-feed-container');
      container.innerHTML = '';

      let filtered = allNewsItems;
      if (currentCurrencyFilter !== 'ALL') {
        filtered = allNewsItems.filter(item => item.currencies.includes(currentCurrencyFilter));
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-500 font-mono text-sm">No stored headlines for ${currentCurrencyFilter} right now.</div>`;
        return;
      }

      filtered.forEach(item => {
        const timeAgo = getTimeAgo(item.pubDate);
        const card = document.createElement('a');
        card.href = item.link;
        card.target = '_blank';
        card.className = "block p-4 bg-terminalBg/60 border border-borderDark rounded hover:border-accentBlue/60 transition group";

        let currencyBadges = item.currencies.map(c => `<span class="bg-accentBlue/10 text-accentBlue border border-accentBlue/30 text-[10px] font-bold px-1.5 py-0.5 rounded">${c}</span>`).join(' ');

        card.innerHTML = `
          <div class="flex justify-between items-center mb-1.5">
            <div class="flex items-center space-x-1">
              ${currencyBadges}
            </div>
            <span class="text-[11px] text-emerald-400 font-mono">${timeAgo}</span>
          </div>
          <h3 class="text-sm font-semibold text-white group-hover:text-accentBlue transition leading-snug mb-1">${item.title}</h3>
          <span class="text-[10px] text-gray-400 uppercase tracking-wider"><i class="fa-solid fa-arrow-up-right-from-square text-[9px] mr-1"></i> Read Article</span>
        `;

        container.appendChild(card);
      });
    }

    function filterNews(ccy) {
      currentCurrencyFilter = ccy;
      document.querySelectorAll('.currency-filter-btn').forEach(btn => {
        if (btn.getAttribute('data-ccy') === ccy) {
          btn.className = 'currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-accentBlue text-white border border-accentBlue';
        } else {
          btn.className = 'currency-filter-btn px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-gray-300 hover:text-white';
        }
      });
      renderNews();
    }

    function getTimeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      if (isNaN(seconds) || seconds < 0) return 'Just now';
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function startCountdown() {
      function update() {
        const now = new Date();
        const targetDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0));
        const diff = targetDate.getTime() - now.getTime();

        if (diff <= 0) {
          document.getElementById('live-countdown').innerText = "00h 00m 00s";
          return;
        }

        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('live-countdown').innerText = 
          `${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
      }

      update();
      setInterval(update, 1000);
    }

    window.onload = function() {
      initializeNewsMemory(); // Instantly displays persistent stories
      fetchLatestNews();       // Pulls fresh updates
      startCountdown();
      setInterval(fetchLatestNews, 60000);
    };
  </script>
</body>
</html>
