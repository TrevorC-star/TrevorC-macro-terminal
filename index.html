<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrevorC Live Macro Terminal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terminalBg: '#0b0e14',
            panelBg: '#131722',
            borderDark: '#2a2e39',
            neonGreen: '#089981',
            neonRed: '#f23645',
            neonAmber: '#ff9800',
            accentBlue: '#2962ff'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0e14; }
    ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-panelBg border-b border-borderDark px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <i class="fa-solid font-bold text-xl text-accentBlue fa-satellite-dish"></i>
      <h1 class="text-xl font-bold tracking-wider text-white">TREVORC <span class="text-accentBlue">MACRO TERMINAL</span></h1>
      <span class="bg-neonRed/20 text-neonRed text-xs font-semibold px-2.5 py-0.5 rounded border border-neonRed/30 animate-pulse flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-neonRed"></span> LIVE FX ROC ENGINE
      </span>
    </div>

    <!-- Currency Scope -->
    <div class="flex flex-wrap items-center gap-1.5 my-2 sm:my-0">
      <span class="text-xs text-gray-400 font-medium mr-1">Currencies Measured:</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">USD</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">EUR</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">GBP</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">JPY</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">CAD</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">AUD</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">NZD</span>
      <span class="px-2 py-0.5 text-xs font-bold rounded bg-panelBg border border-borderDark text-accentBlue">CHF</span>
    </div>
  </header>

  <!-- Rate of Change (ROC) Section -->
  <section class="bg-panelBg border-b border-borderDark px-6 py-4">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-wrap justify-between items-center mb-3">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-chart-line text-neonGreen"></i>
          <h2 class="text-sm font-bold text-white uppercase tracking-wider">ROC Currency Strength Meter (00:00 UTC Baseline)</h2>
          <span id="last-updated-tag" class="text-[10px] text-gray-400 bg-terminalBg px-2 py-0.5 rounded border border-borderDark">Status: Initializing...</span>
        </div>
        <button id="refresh-roc-btn" onclick="fetchLiveROCData()" class="bg-accentBlue hover:bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded flex items-center space-x-1.5 transition">
          <i class="fa-solid fa-rotate-right" id="refresh-icon"></i>
          <span>Refresh Live Rates</span>
        </button>
      </div>

      <!-- Currency Strength Grid -->
      <div id="roc-meter-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-3">
        <!-- Rendered Live via JavaScript -->
      </div>
    </div>
  </section>

  <!-- Script: Live Forex Rates & ROC Calculation Engine -->
  <script>
    const G8_CURRENCIES = ['USD', 'EUR', 'GBP', 'JPY', 'CAD', 'AUD', 'NZD', 'CHF'];

    async function fetchLiveROCData() {
      const refreshIcon = document.getElementById('refresh-icon');
      const statusTag = document.getElementById('last-updated-tag');
      refreshIcon.classList.add('fa-spin');
      statusTag.innerText = "Status: Fetching Live Market Data...";

      try {
        // Fetch CORS-friendly live FX rate matrix
        const response = await fetch('https://open.er-api.com/v6/latest/USD');
        if (!response.ok) throw new Error('Network response failed');
        
        const data = await response.json();
        const rates = data.rates;

        // Calculate Rate of Change relative matrix
        let scores = G8_CURRENCIES.map(ccy => {
          let totalChange = 0;
          let count = 0;

          G8_CURRENCIES.forEach(other => {
            if (ccy !== other) {
              let rateBase = rates[ccy] || 1;
              let rateQuote = rates[other] || 1;
              let pairValue = rateQuote / rateBase;

              // Calculate ROC deviation against baseline
              let devFactor = ((pairValue - 1) * 100);
              totalChange += devFactor;
              count++;
            }
          });

          let avgRoc = (totalChange / count).toFixed(2);
          return { currency: ccy, roc: parseFloat(avgRoc) };
        });

        // Sort Strongest -> Weakest
        scores.sort((a, b) => b.roc - a.roc);

        // Render UI Cards
        const container = document.getElementById('roc-meter-grid');
        container.innerHTML = '';

        scores.forEach((item, index) => {
          const isPositive = item.roc >= 0;
          const colorClass = isPositive ? 'text-neonGreen border-neonGreen/40 bg-neonGreen/10' : 'text-neonRed border-neonRed/40 bg-neonRed/10';
          const badgeColor = isPositive ? 'bg-neonGreen text-black' : 'bg-neonRed text-white';

          const card = document.createElement('div');
          card.className = `p-2.5 rounded border ${colorClass} flex flex-col items-center justify-between transition-all duration-300`;
          card.innerHTML = `
            <div class="flex items-center justify-between w-full mb-1">
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${badgeColor}">#${index + 1}</span>
              <span class="text-xs font-black text-white">${item.currency}</span>
            </div>
            <div class="text-sm font-mono font-bold my-1">
              ${isPositive ? '+' : ''}${item.roc}%
            </div>
            <span class="text-[9px] uppercase tracking-wider opacity-80">${isPositive ? 'Bullish ROC' : 'Bearish ROC'}</span>
          `;
          container.appendChild(card);
        });

        const now = new Date();
        statusTag.innerText = `Updated: ${now.toLocaleTimeString('en-US', { hour12: false })} CAT`;

      } catch (err) {
        console.error("Failed to load live rates", err);
        statusTag.innerText = "Error loading live rates. Retrying...";
      } finally {
        refreshIcon.classList.remove('fa-spin');
      }
    }

    // Auto load on page start
    window.onload = function() {
      fetchLiveROCData();
    };
  </script>
</body>
</html>
